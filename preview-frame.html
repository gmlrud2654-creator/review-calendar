<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>후기관리 캘린더 미리보기</title>
<style>
  body{margin:0;background:#dfe3ee;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:18px;display:flex;gap:22px;align-items:flex-start}
  .col{display:flex;flex-direction:column;gap:6px}
  .frame{background:#fff;border-radius:22px;padding:6px;box-shadow:0 8px 30px rgba(0,0,0,.16)}
  iframe{border:0;border-radius:16px;display:block;background:#f4f6fb}
  .label{font-size:12px;color:#555;text-align:center;margin:0}
</style>
</head>
<body>
  <div class="col">
    <div class="frame"><iframe src="index.html?v=7" width="390" height="2400" title="휴대폰 화면"></iframe></div>
    <p class="label">휴대폰 390px</p>
  </div>
  <div class="col">
    <div class="frame"><iframe src="index.html?v=7" width="1024" height="2400" title="아이패드 화면"></iframe></div>
    <p class="label">아이패드 1024px</p>
  </div>
</body>
</html>
